<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three type of list with different Text Format</title>
</head>
<style>
    ol{
        color: blue;
    }
    ul{
        color: green;
    }
    dl{
        color: red;
    }
</style>
<body>
    
<!-- //Ordered list -->
<ol>
<p><b>Daily Routine</b></p>
    <li><b>Wake up</b></li>
    <li><b>Brush Teeth</b></li>
    <li><b>Go To University</b></li>
</ol>

<!-- //unOrdered list -->
<p>Skills</p>
<ul><li><i>Html</i></li>
<li><i>CSS</i></li>
<li><i>javascript</i></li></ul>


<!-- Discription list -->
<dl>
    <dt><u>HTML</u></dt>
    <dd><mark>Hypertext Markup Language</mark></dd>
</dl>


<dl>
    <dt>CSS</dt>
    <dd>Cascading style sheet</dd>
</dl>

</body>
</html>
